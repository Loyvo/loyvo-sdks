# Publishes node/ to npm when a tag like node-v0.2.0 is pushed.
# Uses npm Trusted Publishing (OIDC): no token is stored anywhere. The
# package's npm settings name this repository and this workflow file.
name: node-release

on:
  push:
    tags: ["node-v*"]

permissions:
  contents: read
  id-token: write # proves to npm that this workflow is publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5+ is needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "node-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npm publish --access public
